<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>Pomodoro · Flow Studio</title>
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI Variable Display", "Segoe UI", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
  }

  body[data-theme="dark"] {
    --panel: #16171d;
    --panel-elev: #1f2129;
    --line: rgba(255, 255, 255, 0.11);
    --line-hi: rgba(255, 255, 255, 0.22);
    --ink: #f5f6f8;
    --muted: #9499a6;
    --track: rgba(255, 255, 255, 0.11);
    --glass-base: rgba(20, 21, 28, 0.76);
    --glass-hi: rgba(255, 255, 255, 0.16);
    --glass-lo: rgba(255, 255, 255, 0.03);
    --glass-gloss: rgba(255, 255, 255, 0.24);
    --glass-edge: rgba(255, 255, 255, 0.22);
    --glass-inner: rgba(255, 255, 255, 0.07);
    --glass-track: rgba(255, 255, 255, 0.13);
  }

  body[data-theme="light"] {
    --panel: #fcfbf9;
    --panel-elev: #f2efe9;
    --line: rgba(20, 20, 26, 0.10);
    --line-hi: rgba(20, 20, 26, 0.18);
    --ink: #17181c;
    --muted: #707480;
    --track: rgba(20, 20, 26, 0.10);
    --glass-base: rgba(252, 251, 249, 0.78);
    --glass-hi: rgba(255, 255, 255, 0.85);
    --glass-lo: rgba(255, 255, 255, 0.25);
    --glass-gloss: rgba(255, 255, 255, 0.92);
    --glass-edge: rgba(20, 20, 26, 0.15);
    --glass-inner: rgba(20, 20, 26, 0.06);
    --glass-track: rgba(20, 20, 26, 0.10);
  }

  body[data-mode="focus"] { --accent: #f05a48; --accent-2: #ff8066; --accent-ink: #f05a48; }
  body[data-mode="focus"][data-dir="flow"] { --accent: #8b5cf6; --accent-2: #a78bfa; --accent-ink: #9d74f7; }
  body[data-mode="short"] { --accent: #10b981; --accent-2: #34d399; --accent-ink: #10b981; }
  body[data-mode="long"]  { --accent: #3b82f6; --accent-2: #60a5fa; --accent-ink: #3b82f6; }

  body[data-theme="light"][data-mode="focus"] { --accent-ink: #d94332; }
  body[data-theme="light"][data-mode="focus"][data-dir="flow"] { --accent-ink: #6d3ce0; }
  body[data-theme="light"][data-mode="short"] { --accent-ink: #0c855e; }
  body[data-theme="light"][data-mode="long"]  { --accent-ink: #2563eb; }

  .w { position: absolute; inset: 0; }
  .surface {
    position: absolute; inset: 1px;
    background: var(--panel);
    border: 1px solid var(--line);
    transition: opacity .16s ease, border-color .2s ease;
    overflow: hidden;
  }
  .surface::before {
    content: ''; position: absolute; left: 16%; right: 16%; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--line-hi), transparent);
    pointer-events: none;
  }

  button { -webkit-app-region: no-drag; font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
  svg { display: block; }

  .ico-pause { display: none; }
  body[data-running="true"] .ico-play { display: none; }
  body[data-running="true"] .ico-pause { display: block; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  .ringwrap { position: absolute; pointer-events: none; }
  .ringwrap svg { width: 100%; height: 100%; overflow: visible; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .ring-disc { display: none; fill: var(--panel); stroke: var(--line-hi); stroke-width: 1; }
  .ring-track { fill: none; stroke: var(--track); stroke-linecap: round; }
  .ring-fill { fill: none; stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .3s linear, stroke .2s; }

  .info { position: absolute; display: flex; flex-direction: column; justify-content: center; pointer-events: none; transition: opacity .14s ease; }
  .clock-row { display: flex; align-items: baseline; gap: 6px; }
  .clock {
    font-family: "Cascadia Mono", "JetBrains Mono", "SF Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums; letter-spacing: -0.04em; white-space: nowrap; color: var(--ink);
  }
  .rounds { display: inline-flex; gap: 3px; align-items: center; }
  .r-dot { width: 4.5px; height: 4.5px; border-radius: 50%; clip-path: circle(50% at 50% 50%); background: var(--track); transition: background .2s, transform .2s; }
  .r-dot[data-on="true"] { background: var(--accent); transform: scale(1.1); }

  .label { display: flex; align-items: center; gap: 5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .label span { overflow: hidden; text-overflow: ellipsis; }
  .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; clip-path: circle(50% at 50% 50%); background: var(--accent); }
  body[data-running="true"] .dot { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .32; transform: scale(0.82); } }

  .bare-bar {
    display: none; width: 82px; height: 3px; border-radius: 99px;
    background: rgba(240, 90, 72, 0.32);
    overflow: hidden; pointer-events: none; flex: none;
  }
  .bare-fill {
    height: 100%; width: 100%; border-radius: 99px;
    background: #f05a48;
    background: var(--accent, #f05a48);
    transition: width .3s linear, background .2s;
  }

  .actions { position: absolute; display: flex; align-items: center; }
  .play {
    flex: none; width: 38px; height: 38px; border-radius: 50%; clip-path: circle(50% at 50% 50%);
    background: linear-gradient(145deg, var(--accent-2), var(--accent));
    color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform .12s ease, filter .15s;
  }
  .play:hover { filter: brightness(1.08); transform: scale(1.06); }
  .play:active { transform: scale(.94); }
  .play .ico-play { margin-left: 1.5px; }

  .sub-actions { display: flex; align-items: center; gap: 2px; }
  .stop, .skip-btn {
    flex: none; width: 28px; height: 28px; border-radius: 50%; clip-path: circle(50% at 50% 50%); color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    transition: color .12s, background .12s, opacity .12s;
  }
  .stop:hover, .skip-btn:hover { color: var(--accent-ink); background: color-mix(in srgb, var(--accent) 15%, transparent); }
  body[data-idle="true"] .stop { display: none; }
  body:not([data-dir="countdown"]) .skip-btn { display: none; }
  body[data-view="ring"][data-idle="true"] .sub-actions,
  body[data-view="bare"][data-idle="true"] .sub-actions { display: none; }
  body[data-short="true"] .stop { color: color-mix(in srgb, var(--muted) 65%, transparent); }
  body[data-short="true"] .stop:hover { color: var(--muted); background: color-mix(in srgb, var(--ink) 8%, transparent); }

  body[data-view="card"] .surface {
    border-radius: 28px;
    background:
      radial-gradient(120px 64px at 26px 50%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 100%),
      linear-gradient(145deg, var(--panel-elev), var(--panel) 68%);
  }
  body[data-view="card"] .ringwrap { left: 13px; top: 50%; width: 54px; height: 54px; transform: translateY(-50%); }
  body[data-view="card"] .ring-track, body[data-view="card"] .ring-fill { stroke-width: 7; }
  body[data-view="card"] .actions { inset: 0; padding: 0 10px 0 21px; justify-content: space-between; }
  body[data-view="card"] .info { left: 78px; right: 44px; top: 0; bottom: 0; gap: 4px; }
  body[data-view="card"] .clock { font-size: 26px; font-weight: 600; line-height: 1; }
  body[data-view="card"] .label { font-size: 11px; font-weight: 500; }
  body[data-view="card"] .sub-actions { flex-direction: column; gap: 2px; opacity: 0; transition: opacity .14s ease; }
  body[data-view="card"] .w:is(:hover, :focus-within) .sub-actions { opacity: 1; }

  body[data-view="ring"] .surface { display: none; }
  body[data-view="ring"] .ringwrap { inset: 0; }
  body[data-view="ring"] .ring-disc { display: block; }
  body[data-view="ring"] .ring-track { stroke: var(--glass-track); stroke-width: 5.5; }
  body[data-view="ring"] .ring-fill { stroke-width: 5.5; }
  body[data-view="ring"] .info { inset: 0; align-items: center; justify-content: center; gap: 3px; padding: 0 18px; }
  body[data-view="ring"] .clock-row { flex-direction: column; align-items: center; gap: 3px; }
  body[data-view="ring"] .clock { font-size: 20px; font-weight: 650; line-height: 1; }
  body[data-view="ring"] .label { font-size: 9.5px; max-width: 100%; }
  body[data-view="ring"] .dot { display: none; }
  body[data-view="ring"] .skip-btn { display: none; }

  body[data-view="bare"] .surface { border-radius: 26px; opacity: 0; }
  body[data-view="bare"] .ringwrap { display: none; }
  body[data-view="bare"] .info { inset: 0; align-items: center; justify-content: center; gap: 5px; }
  body[data-view="bare"] .clock { font-size: 30px; font-weight: 600; line-height: 1; color: var(--accent-ink); }
  body[data-view="bare"] .rounds, body[data-view="bare"] .label, body[data-view="bare"] .skip-btn { display: none; }
  body[data-view="bare"] .bare-bar { display: block; }

  body:is([data-view="ring"], [data-view="bare"]) .actions { inset: 0; justify-content: center; gap: 7px; opacity: 0; pointer-events: none; transition: opacity .12s ease; }
  body:is([data-view="ring"], [data-view="bare"]) .w:is(:hover, :focus-within) .actions { opacity: 1; pointer-events: auto; }
  body:is([data-view="ring"], [data-view="bare"]) .w:is(:hover, :focus-within) .info { opacity: 0; }
  body[data-view="bare"] .w:is(:hover, :focus-within) .surface { opacity: 1; }
  body[data-view="ring"] .play, body[data-view="bare"] .play { width: 35px; height: 35px; }

  .menu {
    position: absolute; inset: 1px; z-index: 3; display: none; flex-direction: column; justify-content: center; gap: 5px;
    padding: 8px 10px; background: var(--panel); border: 1px solid var(--line-hi); border-radius: 28px;
  }
  body[data-view="ring"] .menu {
    inset: 9px; border-radius: 50%; clip-path: circle(50% at 50% 50%);
    border: 0; padding: 0 7px; gap: 4px; align-items: center; justify-content: center;
  }
  body[data-view="bare"] .menu { border-radius: 22px; padding: 5px 8px; gap: 3px; }
  body[data-menu="true"] .menu { display: flex; }
  body[data-menu="true"] .info, body[data-menu="true"] .actions, body[data-menu="true"] .bare-bar { opacity: 0 !important; pointer-events: none !important; }
  .menu-row { display: flex; gap: 3px; width: 100%; justify-content: center; }
  .chip {
    flex: 1; height: 21px; border: 1px solid var(--line); border-radius: 999px;
    font-size: 10px; font-weight: 500; line-height: 1; color: var(--muted);
    white-space: nowrap; padding: 0 3px;
    transition: all .12s;
  }
  body[data-view="ring"] .chip { height: 19px; font-size: 9.5px; padding: 0 2px; }
  body[data-view="bare"] .chip { height: 18px; font-size: 9.5px; }
  .chip:hover { color: var(--ink); border-color: var(--line-hi); }
  .chip[aria-pressed="true"] {
    color: var(--accent-ink);
    border-color: color-mix(in srgb, var(--accent) 55%, transparent);
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    font-weight: 600;
  }

  .toast {
    position: absolute; left: 50%; top: 50%; z-index: 4; transform: translate(-50%, calc(-50% + 6px)); opacity: 0; pointer-events: none;
    font-size: 10.5px; font-weight: 500; padding: 5px 11px; border-radius: 999px; background: var(--panel-elev); border: 1px solid var(--line-hi); color: var(--ink); white-space: nowrap;
    transition: opacity .18s ease, transform .18s ease;
  }
  .toast[data-show="true"] { opacity: 1; transform: translate(-50%, -50%); }
  body.offline .clock { opacity: .35; }
</style>
</head>
<body data-view="card" data-mode="focus" data-dir="countdown" data-theme="dark" data-running="false" data-idle="true" data-menu="false">
  <main class="w">
    <div class="surface"></div>
    <div class="ringwrap" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <circle class="ring-disc" cx="50" cy="50" r="46"></circle>
        <circle class="ring-track" cx="50" cy="50" r="42"></circle>
        <circle class="ring-fill" data-ring cx="50" cy="50" r="42"></circle>
      </svg>
    </div>
    <div class="info">
      <div class="clock-row">
        <div class="clock" data-clock role="timer" aria-live="off">25:00</div>
        <div class="rounds" data-rounds aria-hidden="true"></div>
      </div>
      <div class="bare-bar" aria-hidden="true"><div class="bare-fill" data-bare-fill></div></div>
      <div class="label"><i class="dot"></i><span data-label>Focus</span></div>
    </div>
    <div class="actions">
      <button class="play" data-act="toggle" type="button" title="Start / Pause (Space)" aria-label="Start">
        <svg class="ico-play" width="14" height="14" viewBox="0 0 11 11" aria-hidden="true"><path d="M2.6 1.8l6.6 3.7-6.6 3.7z" fill="currentColor"/></svg>
        <svg class="ico-pause" width="14" height="14" viewBox="0 0 10 10" aria-hidden="true"><rect x="1.8" y="1.4" width="2.3" height="7.2" rx="1" fill="currentColor"/><rect x="5.9" y="1.4" width="2.3" height="7.2" rx="1" fill="currentColor"/></svg>
      </button>
      <div class="sub-actions">
        <button class="stop" data-act="finish" type="button" title="Finish &amp; Save" aria-label="Finish &amp; Save">
          <svg width="11" height="11" viewBox="0 0 9 9" aria-hidden="true"><rect x="1" y="1" width="7" height="7" rx="1.6" fill="currentColor"/></svg>
        </button>
        <button class="skip-btn" data-act="skip" type="button" title="Skip current phase" aria-label="Skip current phase">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 2.4l5.4 3.6-5.4 3.6V2.4zm6.4.3h1.3v6.6H8.6V2.7z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <div class="menu" data-menu-panel></div>
    <div class="toast" data-toast role="status" aria-live="polite"></div>
  </main>

<script>
(function () {
  'use strict';

  var VIEWS = ['card', 'ring', 'bare'];
  var API = '/pomodoro/api';
  var RADIUS = 42;
  var CIRCUM = 2 * Math.PI * RADIUS;
  var DICTIONARIES = {
    zh: {
      title: '番茄钟 · Flow Studio', focus: '专注', short: '短休息', long: '长休息', flow: '心流',
      menuFocus: '专注', menuShort: '短休', menuLong: '长休', menuCountdown: '倒计', menuCountup: '正计', menuFlow: '心流',
      countdown: '倒计时', countup: '正计时', flowTitle: '心流模式',
      toggle: '开始 / 暂停 (Space)', start: '开始', pause: '暂停', resume: '继续',
      finish: '结束并记录', skip: '跳过当前阶段', endBreak: '结束本次休息',
      finishShort: '已专注 {time} · 不足 1 分钟，结束将不计入', finishRecorded: '已专注 {time} · 结束并记录',
      recorded: '已记录 {time}', recordedFlow: '已记录 {time} · 建议休 {minutes}m',
      tooShort: '不足 1 分钟，未计入', notRecorded: '未计入',
      breakComplete: '休息结束 · 开始专注', focusComplete: '专注完成 · 休息一下'
    },
    en: {
      title: 'Pomodoro · Flow Studio', focus: 'Focus', short: 'Short Break', long: 'Long Break', flow: 'Flow',
      menuFocus: 'Focus', menuShort: 'Short', menuLong: 'Long', menuCountdown: 'Down', menuCountup: 'Up', menuFlow: 'Flow',
      countdown: 'Countdown', countup: 'Stopwatch', flowTitle: 'Flowtime',
      toggle: 'Start / Pause (Space)', start: 'Start', pause: 'Pause', resume: 'Resume',
      finish: 'Finish & Save', skip: 'Skip current phase', endBreak: 'End break',
      finishShort: 'Focused {time} · Under 1 min, will not be recorded', finishRecorded: 'Focused {time} · Finish & Save',
      recorded: 'Saved {time}', recordedFlow: 'Saved {time} · Rest {minutes}m',
      tooShort: 'Under 1 min, not saved', notRecorded: 'Not saved',
      breakComplete: 'Break over · Focus', focusComplete: 'Focus done · Rest'
    }
  };
  var locale = 'en';
  var toastMessage = null;
  var MENU_KEYS = { focus: 'menuFocus', short: 'menuShort', long: 'menuLong', countdown: 'menuCountdown', countup: 'menuCountup', flow: 'menuFlow' };
  function t(key, values) {
    var text = DICTIONARIES[locale][key] || DICTIONARIES.en[key] || key;
    return text.replace(/\{(\w+)\}/g, function (match, name) { return values && values[name] != null ? String(values[name]) : match; });
  }

  var body = document.body;
  var clockNode = document.querySelector('[data-clock]');
  var labelNode = document.querySelector('[data-label]');
  var roundsNode = document.querySelector('[data-rounds]');
  var bareFillNode = document.querySelector('[data-bare-fill]');
  var toastNode = document.querySelector('[data-toast]');
  var ringNode = document.querySelector('[data-ring]');
  var menuNode = document.querySelector('[data-menu-panel]');
  var toggleNode = document.querySelector('[data-act="toggle"]');
  var stopNode = document.querySelector('[data-act="finish"]');
  var skipNode = document.querySelector('[data-act="skip"]');

  function localize(value) {
    locale = /^zh(?:-|$)/i.test(value || '') ? 'zh' : 'en';
    document.documentElement.lang = locale === 'zh' ? 'zh-CN' : 'en';
    document.title = t('title');
    toggleNode.title = t('toggle');
    toggleNode.setAttribute('aria-label', t('start'));
    stopNode.title = t('finish');
    stopNode.setAttribute('aria-label', t('finish'));
    skipNode.title = t('skip');
    skipNode.setAttribute('aria-label', t('skip'));
    labelNode.textContent = t('focus');
    [].forEach.call(menuNode.querySelectorAll('[data-menu-mode], [data-menu-dir]'), function (node) {
      var key = node.getAttribute('data-menu-mode') || node.getAttribute('data-menu-dir');
      node.textContent = t(MENU_KEYS[key]);
      node.title = t(key === 'flow' ? 'flowTitle' : key);
      node.setAttribute('aria-label', node.title);
    });
    if (toastMessage) toastNode.textContent = t(toastMessage.key, toastMessage.values);
  }

  ringNode.style.strokeDasharray = CIRCUM.toFixed(2) + ' ' + CIRCUM.toFixed(2);
  ringNode.style.strokeDashoffset = '0';
  ringNode.style.opacity = '1';

  var SIZES = { card: [220, 84], ring: [108, 108], bare: [128, 56] };
  var sizedFor = null;
  function fitWindow() {
    var view = body.getAttribute('data-view');
    if (!SIZES[view]) return;
    if (!window.pomodoroWindow || !window.pomodoroWindow.resize) return;
    var targetW = SIZES[view][0];
    var targetH = SIZES[view][1];
    if (view === sizedFor && Math.abs(window.innerWidth - targetW) <= 2 && Math.abs(window.innerHeight - targetH) <= 2) return;
    sizedFor = view;
    window.pomodoroWindow.resize(targetW, targetH);
  }

  function normalizeView(value) {
    if (value === 'mini') return 'card';
    return VIEWS.indexOf(value) >= 0 ? value : null;
  }

  var params = new URLSearchParams(location.search);
  var queryView = normalizeView(params.get('view'));
  if (queryView) body.setAttribute('data-view', queryView);
  fitWindow();
  var queryTheme = params.get('theme');
  if (queryTheme === 'light' || queryTheme === 'dark') body.setAttribute('data-theme', queryTheme);

  function chipRow(items, attr, onPick) {
    var row = document.createElement('div');
    row.className = 'menu-row';
    items.forEach(function (key) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = t(MENU_KEYS[key]);
      chip.title = t(key === 'flow' ? 'flowTitle' : key);
      chip.setAttribute('aria-label', chip.title);
      chip.setAttribute(attr, key);
      chip.addEventListener('click', function () { onPick(key).then(closeMenu); });
      row.appendChild(chip);
    });
    return row;
  }
  menuNode.appendChild(chipRow(['focus', 'short', 'long'], 'data-menu-mode', function (mode) { return act('mode', { mode: mode }); }));
  menuNode.appendChild(chipRow(['countdown', 'countup', 'flow'], 'data-menu-dir', function (dir) { return act('direction', { direction: dir }); }));

  function fmt(ms) {
    var total = Math.max(0, Math.round((ms || 0) / 1000));
    var minutes = Math.floor(total / 60);
    var seconds = total % 60;
    return (minutes < 10 ? '0' : '') + minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
  }

  function toast(key, values) {
    toastMessage = { key: key, values: values };
    toastNode.textContent = t(key, values);
    toastNode.setAttribute('data-show', 'true');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { toastMessage = null; toastNode.removeAttribute('data-show'); }, 2600);
  }

  function chime() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      [0, 0.18, 0.36].forEach(function (at, index) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = [587.33, 880, 1174.66][index];
        gain.gain.setValueAtTime(0.0001, ctx.currentTime + at);
        gain.gain.exponentialRampToValueAtTime(0.20, ctx.currentTime + at + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + at + 0.34);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + at);
        osc.stop(ctx.currentTime + at + 0.38);
      });
      setTimeout(function () { ctx.close && ctx.close(); }, 1200);
    } catch (error) {}
  }

  function openMenu() { body.setAttribute('data-menu', 'true'); }
  function closeMenu() { body.setAttribute('data-menu', 'false'); }

  var state = null;
  var seenCompleted = null;
  var seenFinish = null;
  var MIN_RECORD_MS = 60000;
  var busy = false;
  var lastRoundSig = '';

  function render() {
    var timer = state && state.timer;
    if (!timer) return;
    var countup = timer.direction !== 'countdown';
    var total = Math.max(60000, (timer.config && timer.config[timer.mode] ? timer.config[timer.mode] : 25) * 60000);
    var remaining = timer.remainingMs || 0;
    var elapsed = timer.elapsedMs || 0;
    var running = timer.status === 'running';
    if (running) {
      var nowMs = Date.now();
      if (countup) elapsed += Math.max(0, nowMs - (timer.startedAt || nowMs));
      else remaining = Math.max(0, (timer.deadline || nowMs) - nowMs);
    }
    var progress = countup ? Math.min(1, elapsed / total) : Math.min(1, Math.max(0, 1 - remaining / total));
    var idle = timer.status === 'idle' && !timer.startedAt && elapsed === 0;

    var text = countup ? fmt(elapsed) : fmt(remaining);
    if (clockNode.textContent !== text) clockNode.textContent = text;
    var tight = text.length > 5;
    clockNode.style.fontSize = tight ? '0.82em' : '';

    var modePrefix = t(timer.direction === 'flow' && timer.mode === 'focus' ? 'flow' : timer.mode);
    var label = modePrefix + (state.taskName ? ' · ' + state.taskName : '');
    if (labelNode.textContent !== label) labelNode.textContent = label;
    toggleNode.setAttribute('aria-label', t(running ? 'pause' : timer.status === 'paused' ? 'resume' : 'start'));

    var longEvery = (timer.config && timer.config.longEvery) || 4;
    var round = timer.round || 0;
    var roundSig = round + '/' + longEvery;
    if (roundSig !== lastRoundSig && roundsNode) {
      lastRoundSig = roundSig;
      roundsNode.innerHTML = '';
      for (var i = 0; i < longEvery; i++) {
        var dot = document.createElement('i');
        dot.className = 'r-dot';
        dot.setAttribute('data-on', i < round ? 'true' : 'false');
        roundsNode.appendChild(dot);
      }
    }

    body.setAttribute('data-mode', timer.mode);
    body.setAttribute('data-dir', timer.direction || 'countdown');
    body.setAttribute('data-running', running ? 'true' : 'false');
    body.setAttribute('data-idle', idle ? 'true' : 'false');

    var ringRatio = idle ? 1 : countup ? Math.max(0.06, progress) : Math.max(0.02, 1 - progress);
    ringNode.style.strokeDashoffset = (CIRCUM * (1 - ringRatio)).toFixed(2);
    ringNode.style.opacity = '1';
    if (bareFillNode) bareFillNode.style.width = Math.round(ringRatio * 100) + '%';

    [].forEach.call(document.querySelectorAll('[data-menu-mode]'), function (node) {
      node.setAttribute('aria-pressed', node.getAttribute('data-menu-mode') === timer.mode ? 'true' : 'false');
    });
    [].forEach.call(document.querySelectorAll('[data-menu-dir]'), function (node) {
      node.setAttribute('aria-pressed', node.getAttribute('data-menu-dir') === timer.direction ? 'true' : 'false');
    });

    var focusedMs = countup ? elapsed : Math.max(0, total - remaining);
    var tooShort = timer.mode === 'focus' && focusedMs < MIN_RECORD_MS;
    body.setAttribute('data-short', tooShort && !idle ? 'true' : 'false');
    var stopTitle = timer.mode !== 'focus'
      ? t('endBreak')
      : t(tooShort ? 'finishShort' : 'finishRecorded', { time: fmt(focusedMs) });
    if (stopNode.title !== stopTitle) { stopNode.title = stopTitle; stopNode.setAttribute('aria-label', stopTitle); }

    var completedAt = timer.lastCompletedAt || 0;
    var finishAt = timer.lastFinish ? timer.lastFinish.at : 0;
    if (seenCompleted === null) {
      seenCompleted = completedAt;
      seenFinish = finishAt;
    } else if (finishAt !== seenFinish) {
      seenFinish = finishAt;
      seenCompleted = completedAt;
      announceFinish(timer.lastFinish);
    } else if (completedAt !== seenCompleted) {
      seenCompleted = completedAt;
      celebrate(timer);
    }
  }

  function announceFinish(info) {
    if (!info) return;
    if (info.kind === 'recorded') {
      toast(info.flowBreakMinutes ? 'recordedFlow' : 'recorded', { time: fmt(info.durationMs), minutes: info.flowBreakMinutes });
    } else if (info.kind === 'short') {
      toast(body.getAttribute('data-view') === 'card' ? 'tooShort' : 'notRecorded');
    }
    pull();
  }

  function celebrate(timer) {
    toast(timer.mode === 'focus' ? 'breakComplete' : 'focusComplete');
    var config = (timer && timer.config) || {};
    if (config.sound !== false) chime();
    pull();
  }

  function apply(payload) {
    state = payload;
    localize(payload.locale);
    var view = normalizeView(payload.view);
    if (view) body.setAttribute('data-view', view);
    fitWindow();
    if (payload.theme === 'light' || payload.theme === 'dark') body.setAttribute('data-theme', payload.theme);
    if (payload.opacity && window.pomodoroWindow && window.pomodoroWindow.opacity) window.pomodoroWindow.opacity(payload.opacity);
    body.classList.remove('offline');
    render();
  }

  function pull() {
    return fetch(API + '/state', { cache: 'no-store' })
      .then(function (response) { if (!response.ok) throw new Error('HTTP ' + response.status); return response.json(); })
      .then(function (payload) { apply(payload); return payload; })
      .catch(function () { body.classList.add('offline'); });
  }

  function act(type, extra) {
    var data = { type: type };
    if (extra) Object.keys(extra).forEach(function (key) { data[key] = extra[key]; });
    return fetch(API + '/action', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(data),
    })
      .then(function (response) { return response.json(); })
      .then(function (payload) { if (payload && payload.ok) apply(payload); return payload; })
      .catch(function () { return null; });
  }

  [].forEach.call(document.querySelectorAll('[data-act]'), function (node) {
    node.addEventListener('click', function (event) {
      event.stopPropagation();
      act(node.getAttribute('data-act'));
    });
  });

  document.addEventListener('contextmenu', function (event) {
    event.preventDefault();
    if (body.getAttribute('data-menu') === 'true') closeMenu(); else openMenu();
  });

  var bridge = window.pomodoroWindow;
  var drag = null;
  document.addEventListener('mousedown', function (event) {
    if (event.button !== 0) return;
    if (event.target.closest && event.target.closest('button')) return;
    if (!bridge || !bridge.moveBy) return;
    drag = { x: event.screenX, y: event.screenY };
    event.preventDefault();
  });
  document.addEventListener('mousemove', function (event) {
    if (!drag) return;
    var dx = event.screenX - drag.x;
    var dy = event.screenY - drag.y;
    if (!dx && !dy) return;
    drag = { x: event.screenX, y: event.screenY };
    bridge.moveBy(dx, dy);
  });
  document.addEventListener('mouseup', function () { drag = null; });
  window.addEventListener('blur', function () { drag = null; });

  document.addEventListener('click', function (event) {
    if (body.getAttribute('data-menu') !== 'true') return;
    if (event.target.closest && event.target.closest('.menu')) return;
    closeMenu();
  });

  var lastFrame = 0;
  var lastPull = 0;
  function frame(now) {
    if (now - lastFrame > 120) {
      lastFrame = now;
      render();
    }
    if (now - lastPull > 2000 && !busy && state && state.timer && state.timer.status === 'running') {
      lastPull = now;
      busy = true;
      pull().then(function () { busy = false; });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.addEventListener('visibilitychange', function () { if (!document.hidden) pull(); });
  window.addEventListener('keydown', function (event) {
    if (event.code === 'Space') { event.preventDefault(); act('toggle'); }
    if (event.code === 'Escape') closeMenu();
  });

  localize(locale);
  pull();
  setInterval(pull, 5000);
})();
</script>
</body>
</html>
